name: Build Python wheels
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload wheels to PyPI? (0: no, 1: yes)'
        required: true
        default: '0'

jobs:
  build_wheels:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-26, macos-15-intel]
      fail-fast: false

    name: wheel for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      ###########################################################
      # Setup local environment (source code, build requirements)
      ###########################################################
      - uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/checkout@v4
          with: |
            submodules: recursive
            lfs: true
          attempt_limit: 3
          attempt_delay: 2000

      # The OIDN weights live in a nested submodule and are stored with git-lfs
      - name: Fetch git-lfs objects of submodules
        run: git submodule foreach --recursive git lfs pull

      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: '3.11'

      - name: Prepare compiler environment for Windows
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA on Windows
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.8.1'
          method: network
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'

      # ISPC compiles the CPU kernels. On Linux, cibuildwheel installs it inside
      # the manylinux container instead (see pyproject.toml).
      - name: Install ISPC on macOS
        if: runner.os == 'macOS'
        run: bash .github/workflows/install_ispc.sh

      - name: Install ISPC on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "1.30.0"
          Invoke-WebRequest "https://github.com/ispc/ispc/releases/download/v$v/ispc-v$v-windows.zip" -OutFile ispc.zip
          Expand-Archive ispc.zip -DestinationPath ext
          Rename-Item "ext/ispc-v$v-windows" ispc

      - name: Install cibuildwheel
        run: |
          python -m pip install cibuildwheel==3.3.1

      #########################
      # Build and store wheels
      #########################
      - name: Build wheel
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  upload_pypi:
    name: Upload wheels to PyPI
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.upload == '1'}}
    needs: [build_wheels]

    steps:
      #########################
      # Fetch and upload wheels
      #########################
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_PASSWORD }}
